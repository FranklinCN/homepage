<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THZ HOMEPAGE</title>
    <style>
        :root {
            --bg: #f2efe9;
            --paper: #faf8f4;
            --ink: #1a1815;
            --ink-soft: #55504a;
            --ink-faint: #8f887e;
            --ink-ghost: #b5afa5;
            --accent: #b0442c;
            --accent-deep: #8a3321;
            --line: #d8d2c7;
            --line-hair: #e6e1d8;
            --green: #5b7f5e;
            /* 英文字体优先使用 Times New Roman，中文回退到宋体系 */
            --font-serif: "Times New Roman", "Times", "Songti SC", "SimSun", serif;
            --font-sans: "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
            --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", "Menlo", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent);
            color: var(--paper);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-serif);
            font-size: 16px;
            line-height: 1.75;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(176,68,44,0.02) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(26,24,21,0.025) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* ========== 顶部导航 ========== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 36px 0 20px 0;
            border-bottom: 1px solid var(--line);
            margin-bottom: 56px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar .wordmark {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--ink);
            text-decoration: none;
            line-height: 1;
        }
        .top-bar .wordmark span {
            color: var(--accent);
            font-weight: 400;
        }
        .top-bar .nav-meta {
            display: flex;
            align-items: baseline;
            gap: 28px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }
        .top-bar .nav-meta a {
            color: var(--ink-soft);
            text-decoration: none;
            transition: color 0.25s ease;
        }
        .top-bar .nav-meta a:hover {
            color: var(--accent);
        }
        .top-bar .nav-meta .available-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 6px;
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(91,127,94,0.25); }
            50% { opacity: 0.5; box-shadow: 0 0 0 4px rgba(91,127,94,0); }
        }

        /* ========== 英雄区 ========== */
        .hero {
            margin-bottom: 80px;
        }
        .hero .kicker {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hero .kicker::before {
            content: '';
            width: 28px;
            height: 1px;
            background: var(--accent);
            opacity: 0.6;
        }
        .hero h1 {
            font-size: clamp(42px, 7vw, 78px);
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 24px;
            max-width: 720px;
        }
        .hero h1 .accent-italic {
            color: var(--accent);
            font-style: italic;
            font-weight: 400;
        }
        .hero .lede {
            font-size: 18px;
            line-height: 1.85;
            color: var(--ink-soft);
            max-width: 560px;
            margin-bottom: 40px;
        }
        .hero .lede strong {
            color: var(--ink);
            font-weight: 600;
        }
        .hero .scroll-cue {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-ghost);
        }
        .hero .scroll-cue .line {
            width: 44px;
            height: 1px;
            background: var(--line);
            position: relative;
            overflow: hidden;
        }
        .hero .scroll-cue .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            animation: scrollLine 3s ease-in-out infinite;
        }
        @keyframes scrollLine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* ========== 分区标题 ========== */
        .section-head {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }
        .section-head .index {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--accent);
        }
        .section-head .title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .section-head .extra {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        /* ========== 作品区 ========== */
        .works {
            margin-bottom: 96px;
        }
        .work-item {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 20px;
            padding: 26px 0;
            border-bottom: 1px solid var(--line-hair);
            text-decoration: none;
            color: var(--ink);
            transition: all 0.3s ease;
            cursor: pointer;
            align-items: start;
        }
        .work-item:first-child {
            border-top: 1px solid var(--line-hair);
        }
        .work-item:hover {
            padding-left: 12px;
        }
        .work-item:hover .work-title {
            color: var(--accent);
        }
        .work-item:hover .work-arrow {
            transform: translateX(5px);
            color: var(--accent);
        }
        .work-index {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ink-faint);
            padding-top: 5px;
            letter-spacing: 0.06em;
        }
        .work-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .work-title {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.4;
            transition: color 0.3s ease;
        }
        .work-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--ink-faint);
            text-transform: uppercase;
        }
        .work-desc {
            font-size: 14px;
            color: var(--ink-soft);
            margin-top: 4px;
            max-width: 480px;
            line-height: 1.7;
        }
        .work-arrow {
            font-size: 18px;
            color: var(--ink-ghost);
            align-self: center;
            transition: all 0.3s ease;
            padding-right: 4px;
        }

        /* ========== 关于区 ========== */
        .about {
            margin-bottom: 96px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }
        .about .about-text p {
            margin-bottom: 18px;
            color: var(--ink-soft);
            font-size: 15px;
            line-height: 1.85;
        }
        .about .about-text p:first-child {
            font-size: 17px;
            color: var(--ink);
            line-height: 1.8;
        }
        .about .about-text strong {
            color: var(--ink);
            font-weight: 600;
        }
        .about-facts {
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 2.4;
            color: var(--ink-faint);
            letter-spacing: 0.04em;
            padding-top: 6px;
        }
        .about-facts .fact-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted var(--line);
            padding: 4px 0;
        }
        .about-facts .fact-row .label {
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 10px;
        }
        .about-facts .fact-row .value {
            color: var(--ink);
            font-weight: 500;
            text-align: right;
        }

        /* ========== 联系区 ========== */
        .contact {
            margin-bottom: 80px;
        }
        .contact .contact-inner {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 48px 44px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .contact .contact-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }
        .contact .contact-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .contact .contact-sub {
            font-size: 15px;
            color: var(--ink-soft);
            margin-bottom: 32px;
            font-style: italic;
        }
        .contact .contact-email {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 0.06em;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 4px;
            transition: all 0.3s ease;
            margin-bottom: 28px;
        }
        .contact .contact-email:hover {
            color: var(--accent-deep);
            border-color: var(--accent-deep);
            letter-spacing: 0.1em;
        }
        .contact .contact-socials {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            flex-wrap: wrap;
        }
        .contact .contact-socials a {
            color: var(--ink-faint);
            text-decoration: none;
            transition: color 0.25s ease;
        }
        .contact .contact-socials a:hover {
            color: var(--ink);
        }

        /* ========== 页脚 ========== */
        .footer {
            padding: 28px 0 40px 0;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-ghost);
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer .footer-note {
            color: var(--ink-faint);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 700px) {
            .container {
                padding: 0 20px;
            }
            .top-bar {
                padding-top: 24px;
                margin-bottom: 36px;
                flex-direction: column;
                gap: 8px;
            }
            .hero {
                margin-bottom: 56px;
            }
            .hero h1 {
                font-size: 36px;
            }
            .hero .lede {
                font-size: 16px;
            }
            .about {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .work-item {
                grid-template-columns: 32px 1fr 20px;
                gap: 12px;
                padding: 20px 0;
            }
            .work-title {
                font-size: 16px;
            }
            .work-desc {
                font-size: 13px;
            }
            .contact .contact-inner {
                padding: 32px 20px;
            }
            .contact .contact-title {
                font-size: 24px;
            }
            .section-head .extra {
                display: none;
            }
        }
        @media (max-width: 400px) {
            .hero h1 {
                font-size: 30px;
            }
            .work-item {
                grid-template-columns: 24px 1fr 16px;
                gap: 8px;
            }
            .work-title {
                font-size: 15px;
            }
            .work-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
